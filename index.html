<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Məhsullar Kataloqu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        input, select {
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
            width: 100%;
            max-width: 300px;
            background: #fff;
        }

        input:focus, select:focus {
            border-color: #3498db;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }

        .card-body {
            padding: 15px;
        }

        .card-body h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #2c3e50;
        }

        .card-body p {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .price {
            font-weight: bold;
            color: #e74c3c;
            font-size: 16px;
        }

        .loading, .error {
            text-align: center;
            font-size: 18px;
            margin-top: 50px;
            grid-column: 1 / -1;
        }

        .loading {
            color: #3498db;
        }

        .error {
            color: #e74c3c;
        }
    </style>
</head>
<body>

    <header>
        <h1>Onlayn Məhsul Kataloqu</h1>
        <p>API vasitəsilə əldə edilən məhsul məlumatları</p>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Məhsul adı ilə axtar...">
        <select id="categoryFilter">
            <option value="">Bütün Kateqoriyalar</option>
            <option value="beauty">Gözəllik</option>
            <option value="fragrances">Ətirlər</option>
            <option value="furniture">Mebel</option>
            <option value="groceries">Ərzaq</option>
        </select>
    </div>

    <div class="container" id="productsContainer">

    </div>

    <script>
        const container = document.getElementById('productsContainer');
        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');

        let allProducts = [];

        async function fetchProducts() {
            container.innerHTML = '<div class="loading">Məlumatlar yüklənir, zəhmət olmasa gözləyin...</div>';
            try {
                const response = await fetch('https://dummyjson.com/products');
                
                if (!response.ok) {
                    throw new Error('Məlumatları əldə etmək mümkün olmadı!');
                }

                const data = await response.json();
                allProducts = data.products;
                displayProducts(allProducts);
            } catch (error) {
                container.innerHTML = `<div class="error">Xəta baş verdi: ${error.message}</div>`;
            }
        }

    
        function displayProducts(products) {
            if (products.length === 0) {
                container.innerHTML = '<div class="error">Heç bir uyğun məlumat tapılmadı.</div>';
                return;
            }

            container.innerHTML = '';
            products.forEach(p => {
                const card = document.createElement('div');
                card.classList.add('card');

                card.innerHTML = `
                    <img src="${p.thumbnail}" alt="${p.title}">
                    <div class="card-body">
                        <h3>${p.title}</h3>
                        <p>${p.description.substring(0, 60)}...</p>
                        <p class="price">Qiymət: $${p.price}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterAndDisplay() {
            const searchText = searchInput.value.toLowerCase();
            const selectedCat = categoryFilter.value;

            const filtered = allProducts.filter(p => {
                const matchesSearch = p.title.toLowerCase().includes(searchText);
                const matchesCat = selectedCat === "" || p.category === selectedCat;
                return matchesSearch && matchesCat;
            });

            displayProducts(filtered);
        }

        searchInput.addEventListener('input', filterAndDisplay);
        categoryFilter.addEventListener('change', filterAndDisplay);

        fetchProducts();
    </script>
</body>
</html>
